<!DOCTYPE html>
<html lang="sr-Cyrl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="stylesheet" href="style.css" />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="app" class="app" data-page-kind="cover">
      <main class="reader">
        <article id="page" class="page page-cover">
          <figure class="cover-stack">
            <img
              class="cover-image"
              src="pokrov-cover.jpg"
              alt="Покров Пресвете Богородице"
              width="622"
              height="752"
            />
            <div class="cover-side">
              <h1 class="cover-title">Манастир Лешје</h1>
              <div class="swipe-hint" aria-hidden="true">
                <img class="swipe-finger" src="swipe-hint.png" alt="" width="96" height="96" />
              </div>
            </div>
          </figure>
        </article>
      </main>
      <div class="chrome" id="chrome">
        <button type="button">Садржај</button>
        <button type="button">А−</button>
        <span class="page-indicator">3 / 22</span>
        <button type="button">А+</button>
      </div>
    </div>
    <button type="button" id="install-btn" class="install-btn" aria-label="Преузми апликацију">
      <span>Преузми</span>
      <svg class="download-icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path
          fill="currentColor"
          d="M5 20h14v-2H5v2zm7-16v10.17l3.59-3.58L17 12l-5 5-5-5 1.41-1.41L11 14.17V4h2z"
        />
      </svg>
    </button>
  </body>
</html>
