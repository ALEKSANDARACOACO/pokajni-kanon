<!DOCTYPE html>
<html lang="sr-Cyrl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta name="theme-color" content="#1a1210" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Покајни канон" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>ПОКАЈНИ КАНОН ГОСПОДУ НАШЕМ ИСУСУ ХРИСТУ</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icons/icon-192.png?v=18" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="icons/icon-180.png?v=18" />
    <link rel="stylesheet" href="style.css?v=18" />
    <script>
      (function () {
        var BUILD = "18";
        if (!("serviceWorker" in navigator)) {
          return;
        }
        var needsRefresh = localStorage.getItem("pokajni-build") !== BUILD;
        var ready = Promise.resolve();
        if (needsRefresh) {
          ready = navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
          }).then(function () {
            if (!window.caches) {
              return;
            }
            return caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (key) { return caches.delete(key); }));
            });
          });
        }
        ready.then(function () {
          return navigator.serviceWorker.register("sw.js?v=" + BUILD, {
            updateViaCache: "none",
          });
        }).then(function () {
          if (needsRefresh) {
            localStorage.setItem("pokajni-build", BUILD);
            location.reload();
          }
        }).catch(function () {});
      })();
    </script>
  </head>
  <body>
    <div id="app" class="app">
      <main id="reader" class="reader" tabindex="0">
        <article id="page" class="page" aria-live="polite"></article>
      </main>

      <div id="stats" class="stats" hidden>
        Прегледи: <span id="stat-views">—</span>
        · Преузимања: <span id="stat-downloads">—</span>
      </div>

      <button type="button" id="install-btn" class="install-btn" hidden>
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path
            fill="currentColor"
            d="M12 3a1.2 1.2 0 0 1 1.2 1.2v8.3l2.6-2.6a1.2 1.2 0 1 1 1.7 1.7l-4.7 4.7a1.2 1.2 0 0 1-1.7 0l-4.7-4.7a1.2 1.2 0 1 1 1.7-1.7l2.6 2.6V4.2A1.2 1.2 0 0 1 12 3zm-8 14.2c0-.7.5-1.2 1.2-1.2h13.6c.7 0 1.2.5 1.2 1.2V20c0 .7-.5 1.2-1.2 1.2H5.2A1.2 1.2 0 0 1 4 20v-2.8z"
          />
        </svg>
        <span>Инсталирај</span>
      </button>

      <div id="install-help" class="install-help" hidden>
        <p id="install-help-text"></p>
        <button type="button" id="install-help-close">Затвори</button>
      </div>

      <div class="chrome" id="chrome">
        <button type="button" id="contents-btn">Садржај</button>
        <button type="button" id="font-down" aria-label="Смањи слова">А−</button>
        <span id="page-indicator" class="page-indicator"></span>
        <button type="button" id="font-up" aria-label="Увећај слова">А+</button>
      </div>
    </div>
    <script src="izvor.js?v=18"></script>
    <script src="script.js?v=18"></script>
  </body>
</html>
