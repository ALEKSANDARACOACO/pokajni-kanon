<!DOCTYPE html>
<html lang="sr-Cyrl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta name="theme-color" content="#1a1210" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Покајни канон" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>ПОКАЈНИ КАНОН ГОСПОДУ НАШЕМ ИСУСУ ХРИСТУ</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="stylesheet" href="style.css?v=14" />
    <script>
      (function () {
        var BUILD = "14";
        if (!("serviceWorker" in navigator)) {
          return;
        }
        var needsRefresh = localStorage.getItem("pokajni-build") !== BUILD;
        var ready = Promise.resolve();
        if (needsRefresh) {
          ready = navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
          }).then(function () {
            if (!window.caches) {
              return;
            }
            return caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (key) { return caches.delete(key); }));
            });
          });
        }
        ready.then(function () {
          return navigator.serviceWorker.register("sw.js?v=" + BUILD, {
            updateViaCache: "none",
          });
        }).then(function () {
          if (needsRefresh) {
            localStorage.setItem("pokajni-build", BUILD);
            location.reload();
          }
        }).catch(function () {});
      })();
    </script>
  </head>
  <body>
    <div id="app" class="app">
      <main id="reader" class="reader" tabindex="0">
        <article id="page" class="page" aria-live="polite"></article>
      </main>

      <div id="stats" class="stats" hidden>
        Прегледи: <span id="stat-views">—</span>
        · Преузимања: <span id="stat-downloads">—</span>
      </div>

      <div class="chrome" id="chrome">
        <button type="button" id="download-btn" aria-label="Преузми текст">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path
              fill="currentColor"
              d="M12 3a1 1 0 0 1 1 1v8.6l2.3-2.3a1 1 0 1 1 1.4 1.4l-4 4a1 1 0 0 1-1.4 0l-4-4a1 1 0 1 1 1.4-1.4L11 12.6V4a1 1 0 0 1 1-1zm-7 14a1 1 0 0 1 1 1v1h12v-1a1 1 0 1 1 2 0v2a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-2a1 1 0 0 1 1-1z"
            />
          </svg>
        </button>
        <button type="button" id="contents-btn">Садржај</button>
        <button type="button" id="font-down" aria-label="Смањи слова">А−</button>
        <span id="page-indicator" class="page-indicator"></span>
        <button type="button" id="font-up" aria-label="Увећај слова">А+</button>
      </div>
    </div>
    <script src="izvor.js?v=14"></script>
    <script src="script.js?v=14"></script>
  </body>
</html>
